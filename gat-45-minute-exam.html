<script>

let state=null,saveOK=true,lastWarning='',dialogAction=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

swered':'answered'}" ${j===i?'aria-current="true"':''}>${j+1}</button>`).join('')}</nav></section></div><div class="finish-row"><p id="save-note">${saveOK?'Progress is saved on this browser.':'Keep this page open; progress cannot be saved.'}</p><button id="finish" class="secondary">Finish and view report</button></div>`;

function report(){const stats=sectionStats(),total=correct(),count=answered(),pct=Math.round(total/30*100),highest=Math.max(...stats.map(x=>x.score)),lowest=Math.min(...stats.map(x=>x.score)),missed=Q.filter((q,i)=>state.answers[i]!==q.answer),elapsed=timeText((state.finishedAt||Date.now())-state.startedAt);const strong=stats.filter(s=>s.score===highest).map(s=>s.name),weak=stats.filter(s=>s.score===lowest);const allEqual=highest===lowest;
app.innerHTML=`<section class="panel"><div class="report-head"><div><div class="eyebrow">Performance report</div><h1>${esc(state.name)}</h1><p class="muted">${state.reason==='time'?'Time limit reached':'Attempt submitted'} • Time used ${elapsed} • ${count}/30 answered</p><p class="printed">Dr. Mohanad Al Jbour • GAT English • 45-minute assessment</p></div><div><div class="score">${total}<small> / 30</small></div><strong>${pct}% first-answer accuracy</strong></div></div><p class="small-note">Feedback appeared after each answer. Use this guided-practice result to plan revision; confirm progress later with new questions.</p></section><div class="report-grid">${stats.map(s=>`<section class="result-card"><h3>${s.name}</h3><b>${s.score}<span class="muted"> / 6</span></b><div>${Math.round(s.score/6*100)}% correct</div><div class="bar"><span style="width:${s.score/6*100}%"></span></div><p class="help">${6-s.count} unanswered</p></section>`).join('')}</div><div class="report-grid-two"><section class="panel"><h2>${allEqual?'A balanced result':'Strongest performance'}</h2><p>${allEqual?`All five parts have the same score: ${highest}/6. Review the individual questions before choosing your next focus.`:`${esc(strong.join(', '))} (${highest}/6).`}</p><p>${total===30?'All first answers were correct. Next, try a fresh set without feedback during the attempt.':highest>=5?'These parts show a strong result on this set. Check that you can explain the evidence or relationship.':'Even the highest section still has room for practice. Review why each missed answer failed.'}</p></section><section class="panel"><h2>${total===30?'Next step':'Revision priority'}</h2>${total===30?'<p>Retest with unfamiliar questions and keep practising evidence-based explanations.</p>':weak.map(s=>`<p><strong>${s.name} (${s.score}/6): ${plans[s.section][0]}</strong><br>${plans[s.section][1]}</p>`).join('')}</section></div><section class="panel"><h2>Skills to revisit</h2>${missed.length?`<p>Check these question-level skills with your teacher. One item is a clue for follow-up, not a complete diagnosis.</p><p>${missed.map(q=>`Q${q.id}: ${esc(q.skill)}${state.answers[q.id-1]===null?' (unanswered)':''}`).join(' • ')}</p>`:'<p>No missed questions in this attempt.</p>'}<p class="small-note">The report stays on this device. Download it or print it as a PDF to share with your teacher.</p></section><div class="report-actions no-print"><button class="primary" id="download-report">Download report</button><button id="print-report">Print / Save as PDF</button><button id="new-attempt">Start a new attempt</button></div><h2>Review all 30 questions</h2><p class="small-note">Open a question to review your answer, the correct answer and the explanation.</p>${Q.map((q,i)=>{const a=state.answers[i],ok=a===q.answer;return `<details class="review" ${!ok?'open':''}><summary><span class="${ok?'correcttext':'wrongtext'}">${ok?'✓':'✕'}</span> Q${i+1} · ${S[q.section]} · ${esc(q.skill)}</summary><p><strong>${esc(q.stem.replace(/\[\[|\]\]/g,''))}</strong></p><p>Your answer: ${a===null?'Unanswered':'ABCD'[a]+'. '+esc(q.options[a])}.<br>Correct answer: ${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}${q.replacement?' — use '+esc(q.replacement)+' instead':''}.</p>${a!==null?`<p>${esc(q.feedback[a])}</p>`:''}<p>${esc(q.why)}</p><p><strong>Clue:</strong> ${esc(q.clue)}</p><p><strong>Strategy:</strong> ${esc(q.tip)}</p></details>`;}).join('')}`;
document.getElementById('download-report').onclick=downloadReport;document.getElementById('print-report').onclick=()=>window.print();document.getElementById('new-attempt').onclick=()=>ask('Start a new attempt?','Download this report first if you want to keep it. A new attempt clears the saved answers on this browser.','Start again',()=>{state=null;try{localStorage.removeItem(KEY);}catch(e){}lastWarning='';render();window.scrollTo(0,0);});}
function downloadReport(){const stats=sectionStats(),lines=['GAT ENGLISH — GUIDED ASSESSMENT','Dr. Mohanad Al Jbour','Student: '+state.name,'Score: '+correct()+'/30 ('+Math.round(correct()/30*100)+'%)','Answered: '+answered()+'/30','Time used: '+timeText(state.finishedAt-state.startedAt),'First answers count. Feedback was shown during the attempt.','',...stats.map(s=>s.name+': '+s.score+'/6'),'',...Q.map((q,i)=>{const a=state.answers[i];return `Q${i+1} | ${S[q.section]} | ${q.skill}\n${q.stem.replace(/\[\[|\]\]/g,'')}\nYour answer: ${a===null?'Unanswered':'ABCD'[a]+'. '+q.options[a]}\nCorrect: ${'ABCD'[q.answer]}. ${q.options[q.answer]}${q.replacement?' (replace with '+q.replacement+')':''}\n${a!==null?q.feedback[a]+' ':''}${q.why}\nClue: ${q.clue}\nStrategy: ${q.tip}\n`;})];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='GAT_45_Minute_Report_'+state.name.replace(/[^a-zA-Z0-9_-]+/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('cancel-dialog').onclick=()=>document.getElementById('confirm').close();document.getElementById('accept-dialog').onclick=()=>{document.getElementById('confirm').close();if(dialogAction)dialogAction();};let printOpen=[];window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('.review')].map(d=>d.open);document.querySelectorAll('.review').forEach(d=>d.open=true);});window.addEventListener('afterprint',()=>document.querySelectorAll('.review').forEach((d,i)=>d.open=printOpen[i]));document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock();});render();setInterval(updateClock,1000);
</script></body></html>
